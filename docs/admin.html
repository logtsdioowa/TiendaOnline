<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin.css">
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>

<div id="notification" class="notification"></div>
<body>

<div class="mainBody">

    <!-- HEADER -->
    <header class="admin-header">
    <button onclick="logout()" class="logout-btn">
        Cerrar sesión
    </button>

</header>   

    <!-- CONTENIDO -->
    <div class="container mt-5">

                <button class="btn btn-success mb-3"
                    data-bs-toggle="modal"
                    data-bs-target="#addModal">
            + Agregar producto
        </button>
        <div class="row" id="productsContainer">
          
            <!-- Aquí se insertan las cards -->
        </div>

    </div>

</div>



<!-- MODAL Eliminar -->
<div class="modal fade" id="exampleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Confirmar eliminación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p id="modalText">¿Seguro que deseas eliminar este producto?</p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger" onclick="deleteProduct(selectedId)">
            Eliminar
        </button>
      </div>

    </div>
  </div>
</div>

<!--Modal Editar-->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        
        <input type="hidden" id="editId">

        <div class="mb-2">
          <label class="form-label" for="editName" required>Nombre</label>
          <input type="text" id="editName" class="form-control" required>
        </div>

        <div class="mb-2">
          <label class="form-label" for="editDescription">Descripción</label>
          <input type="text" id="editDescription" class="form-control">
        </div>

        <div class="mb-2">
          <label class="form-label " for="editPrice ">Precio</label>
          <input type="number" id="editPrice" class="form-control">
        </div>

        <div class="mb-2">
            <label class="form-label" for="editImage"  >Nueva imagen (opcional)</label>
            <input type="file" id="editImage" class="form-control" accept="image/*">
        </div>
              <div class="mb-2">
                  <label class="form-label" for="editCategory">Categoría</label>
                  <select id="editCategory" class="form-control">
                      <option value="">Selecciona categoría</option>
                  </select>
              </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="updateProduct()">Guardar cambios</button>
      </div>

    </div>
  </div>
</div>
<!-- Modal Agregar -->
 <div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Agregar producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="text" id="addName" class="form-control mb-2" placeholder="Nombre">
        <input type="text" id="addDescription" class="form-control mb-2" placeholder="Descripción">
        <input type="number" id="addPrice" class="form-control mb-2" placeholder="Precio">
        <input type="file" id="addImage" class="form-control">
        <select id="addCategory" class="form-control mb-2">
          <option value="">Selecciona categoría</option>
      </select>
      </div>

      <div class="modal-f<img src="${API_BASE_URL}${product.Url}"oter">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success" onclick="createProduct()">Guardar</button>
      </div>

    </div>
  </div>
</div>


<script src="./js/config.js"></script>
<script src="./js/admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
