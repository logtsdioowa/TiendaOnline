<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/lgs.css">
</head>

<body>
     
    <div class="login-wrapper container d-flex flex-column align-items-center justify-content-center min-vh-100" id="loginPage">
        <h1 id="title">La casita del hela2</h1>

        <form id="loginForm">
            
            <div class="form-group row-cols-lg-6">
                <label class="col-sm-2 col-form-label">Usuario</label>
                <div class="col-sm-10">
                    <input type="text" id="username" class="form-control" required>
                </div>
            </div>

            <div class="form-group row-cols-lg-6 items-center">
                <label class="col-sm-2 col-form-label">Password</label>
                <div class="col-sm-10">
                    <input type="password" id="password" class="form-control" required>
                </div>
            </div>
            <p id="error" style="color:red;"></p>

            <button type="submit">Login</button>

        </form>
</div>

    <script src="./js/config.js"></script>
    <script src="./js/login.js"></script>
       
</body>
</html>
